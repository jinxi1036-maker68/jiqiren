<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>凌矩具身数据协同平台</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <!-- ================= PUBLIC SHELL (登录页 / 30秒老板场景备案页) ================= -->
  <div id="publicShell" class="public-shell hidden">
    <header class="public-header">
      <div class="brand-inline">
        <div class="logo-mark">LJ</div>
        <span class="brand-name">凌矩具身数据协同平台</span>
        <span class="tag tag-green">V1.0 试行</span>
      </div>
      <div class="row-gap">
        <button class="btn btn-ghost-dark" id="pubNavScene">实体老板场景备案</button>
        <button class="btn btn-primary" id="pubNavLogin">认证账号登录</button>
      </div>
    </header>

    <!-- 公开页 A：30秒场景备案 -->
    <main id="publicScenePage" class="public-main hidden">
      <div class="narrow-wrap">
        <div class="page-intro">
          <h1>工厂 / 仓库 / 门店真实场景免费备案</h1>
          <p class="subtext">只需 30 秒登记您的城市与日常作业。信息全程保密脱敏，匹配到同城同行业甲方任务时再联系您核对进场。</p>
        </div>

        <form id="publicSceneForm" class="surface-card stack-lg">
          <div class="form-section-title">1. 场地基本信息</div>
          <div class="grid-3">
            <label>省份 *<input name="province" placeholder="如：河南" required /></label>
            <label>城市 *<input name="city" placeholder="如：平顶山" required /></label>
            <label>区/县<input name="district" placeholder="如：新华区" /></label>
          </div>
          <div class="grid-3">
            <label>场景类型 *
              <select name="category" required>
                <option value="工厂车间">工厂车间（装配/质检/包装）</option>
                <option value="零售购物空间">零售门店（文具店/商超）</option>
                <option value="仓库">仓库（入库/分拣/货位）</option>
                <option value="手工组装作坊">手工组装订单场地</option>
                <option value="生活服务空间">生活服务空间</option>
                <option value="其他">其他真实商业场景</option>
              </select>
            </label>
            <label>可容纳采集机位<input type="number" name="estimated_device_capacity" min="1" max="50" value="2" /></label>
            <label>可配合时段<input name="open_hours_desc" placeholder="如：每天 09:00-18:00" /></label>
          </div>
          <label>每天实际正在发生的作业内容 *
            <textarea name="daily_work_desc" rows="3" required placeholder="例如：中性笔装配、文具货架补货理货、周转箱分拣入库（严禁摆拍及涉及未成年人）"></textarea>
          </label>

          <div class="divider"></div>
          <div class="form-section-title">2. 保密联系信息（仅凌矩审核可见，绝不公开）</div>
          <div class="grid-3">
            <label>门店 / 工厂名称 *<input name="real_store_name" required placeholder="审核锁单前保密" /></label>
            <label>联系人称呼 *<input name="real_contact_name" required placeholder="如：王老板" /></label>
            <label>联系电话 / 微信 *<input name="real_contact_phone" required placeholder="仅凌矩联系使用" /></label>
          </div>
          <label>详细地址 *<input name="real_address" required placeholder="如：XX市XX区XX路XX号" /></label>

          <label class="ack-box">
            <input type="checkbox" name="zero_promise_ack" required />
            <span>我已知晓：本次备案完全免费，凌矩不承诺立刻排单或保底收益，仅在匹配到合适甲方需求与当地认证团队时联系确认。</span>
          </label>

          <div class="row-end">
            <button type="submit" class="btn btn-primary btn-lg">提交免费备案</button>
          </div>
          <div id="publicSceneResult" class="success-banner hidden"></div>
        </form>
      </div>
    </main>

    <!-- 公开页 B：认证登录 -->
    <main id="publicLoginPage" class="public-main hidden">
      <div class="login-wrap surface-card stack-lg">
        <div>
          <h1 style="font-size:22px;margin:0 0 6px;">认证账号登录</h1>
          <p class="subtext" style="margin:0;">不开放公开注册，仅支持凌矩总控核验发放的团队与管理员账号。</p>
        </div>
        <form id="loginForm" class="stack-md">
          <label>账号<input name="username" required autocomplete="username" placeholder="请输入登录账号" /></label>
          <label>密码<input type="password" name="password" required autocomplete="current-password" placeholder="请输入登录密码" /></label>
          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">进入工作台</button>
        </form>
        <div class="demo-box">
          <div class="demo-title">本地演示体验账号（点击即可一键填入）</div>
          <div class="demo-btns">
            <button type="button" class="chip-btn" data-fill="admin|Lingju@2026!">凌矩总控管理员</button>
            <button type="button" class="chip-btn" data-fill="agent_demo_ent|Agent@2026!">代理：企业开票团队</button>
            <button type="button" class="chip-btn" data-fill="agent_demo_cap|Agent@2026!">代理：熟人特批团长</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- ================= APP SHELL (左侧大模块导航 + 右侧二级工作区) ================= -->
  <div id="appShell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-mark">LJ</div>
        <div>
          <div class="sidebar-title">凌矩协同平台</div>
          <div class="sidebar-role" id="sidebarRoleLabel">工作台</div>
        </div>
      </div>

      <nav class="side-nav" id="sideNav"></nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="user-name" id="sidebarUserName"></div>
          <div class="user-meta" id="sidebarUserMeta"></div>
        </div>
        <div class="footer-actions">
          <button class="side-link-sm" id="btnSwitchPublic">查看老板备案页</button>
          <button class="side-link-sm danger-text" id="btnLogout">退出登录</button>
        </div>
      </div>
    </aside>

    <div class="workspace">
      <header class="ws-header">
        <div>
          <h1 class="ws-title" id="wsTitle">总览</h1>
          <div class="ws-sub" id="wsSub"></div>
        </div>
        <div class="ws-actions" id="wsActions"></div>
      </header>

      <!-- 二级细分小模块 Tab 栏（有小模块时自动显示） -->
      <div class="subtabs-bar hidden" id="subtabsBar"></div>

      <!-- 主内容区 -->
      <section class="ws-content" id="wsContent"></section>
    </div>
  </div>

  <!-- ================= 右侧滑出抽屉（所有新建表单 / 详情 / 审批操作统一放这里，列表页保持干净） ================= -->
  <div id="drawerBackdrop" class="drawer-backdrop hidden">
    <div class="drawer-panel">
      <div class="drawer-header">
        <h2 id="drawerTitle">操作</h2>
        <button class="icon-close" id="btnCloseDrawer" aria-label="关闭">✕</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
